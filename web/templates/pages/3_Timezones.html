{{ define "content" }}

<div class="page-top">
    <div class="header">
        <div class="page-header">
            <div>
                <h1>Timezones</h1>
                <p>Manage timezone settings for users.</p>
            </div>

            {{ template "user_profile" . }}
        </div>
    </div>

    {{ template "search" . }}
</div>

<section class="editable-table">
    <div class="editable-table-header">
        <div>User</div>
        <div>Timezone</div>
        <div></div>
    </div>

    <div class="editable-row">
        <div class="editable-cell">
            <div class="user-info">
                <div class="user-icon">?</div>
                <div class="user-name">Ashish</div>
            </div>
        </div>

        <div class="editable-cell">
            <select>
                <option>Asia/Tokyo</option>
                <option>Asia/Kathmandu</option>
                <option>Asia/Singapore</option>
                <option>Europe/London</option>
                <option>Europe/Berlin</option>
                <option>America/New_York</option>
                <option>America/Los_Angeles</option>
                <option>UTC</option>
            </select>
        </div>

        <div class="editable-actions">
            <button class="editable-remove" type="button">×</button>
        </div>
    </div>

    <div class="editable-row">
        <div class="editable-cell">
            <div class="user-info">
                <div class="user-icon">?</div>
                <div class="user-name">Another User</div>
            </div>
        </div>

        <div class="editable-cell">
            <select>
                <option>Asia/Kathmandu</option>
                <option>Asia/Tokyo</option>
                <option>Asia/Singapore</option>
                <option>Europe/London</option>
                <option>Europe/Berlin</option>
                <option>America/New_York</option>
                <option>America/Los_Angeles</option>
                <option>UTC</option>
            </select>
        </div>

        <div class="editable-actions">
            <button class="editable-remove" type="button">×</button>
        </div>
    </div>

    <button class="editable-add" type="button">+</button>
</section>

<div class="page-actions">
    <button class="button" type="button" disabled>
        Discard
    </button>

    <button class="button button-primary" type="button" disabled>
        Save changes
    </button>
</div>

{{ template "flash_box" . }}
{{ end }}
