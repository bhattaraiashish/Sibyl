{{ define "content" }}

<div class="page-top">
    <div class="header">
        <div class="page-header">
            <div>
                <h1>Guilds</h1>
                <p>Manage the guilds where Sibyl is installed.</p>
            </div>

            {{ template "user_profile" . }}
        </div>
    </div>
</div>

<section class="editable-table">
    <div class="editable-table-header">
        <div>Guild</div>
        <div>Features</div>
        <div></div>
    </div>

    <div class="editable-row">
        <div class="editable-cell">
            <div class="guild-info">
                <img class="guild-icon" src="/static/default-avatar.svg" alt="">
                <div class="guild-name">My Server</div>
            </div>
        </div>

        <div class="editable-cell">
            <div class="features">
                <label class="feature-toggle">
                    <input type="checkbox" name="rss" checked>
                    <span>RSS</span>
                </label>

                <label class="feature-toggle">
                    <input type="checkbox" name="anime">
                    <span>Anime</span>
                </label>
            </div>
        </div>

        <div class="editable-actions"></div>
    </div>

    <div class="editable-row">
        <div class="editable-cell">
            <div class="guild-info">
                <div class="guild-icon">ES</div>
                <div class="guild-name">Example Server</div>
            </div>
        </div>

        <div class="editable-cell">
            <div class="features">
                <label class="feature-toggle">
                    <input type="checkbox" name="rss" checked>
                    <span>RSS</span>
                </label>

                <label class="feature-toggle">
                    <input type="checkbox" name="anime">
                    <span>Anime</span>
                </label>
            </div>
        </div>

        <div class="editable-actions"></div>
    </div>
</section>

<div class="page-actions">
    <button class="button" type="button" disabled>
        Discard
    </button>

    <button class="button button-primary" type="button" disabled>
        Save changes
    </button>
</div>

{{ end }}
