{{ define "content" }}

<div class="page-top">
    <div class="header">
        <div class="page-header">
            <div>
                <h1>Settings</h1>
                <p>Configure Sibyl.</p>
            </div>

            {{ template "user_profile" . }}
        </div>
    </div>
</div>

<form method="POST" action="/update/settings" id="settings-form">

    <div class="editable-table">
        <div class="editable-table-header">
            <div>Setting</div>
            <div>Value</div>
            <div></div>
        </div>

        <div class="editable-row">
            <div class="editable-cell">
                Notification Interval (mins)
            </div>

            <div class="editable-cell">
                {{ if .Config.CanEdit }}
                <input type="number" name="notification_interval" value="{{ .Config.NotificationIntervalMins }}"
                    data-original-value="{{ .Config.NotificationIntervalMins }}" min="1" step="1">
                {{ else }}
                <span>{{ .Config.NotificationIntervalMins }}</span>
                {{ end }}
            </div>

            <div class="editable-actions"></div>
        </div>
    </div>

    {{ if .Config.CanEdit }}
    <div class="page-actions">
        <button id="discard-changes" class="button" type="button" disabled>
            Discard
        </button>

        <button id="save-changes" class="button button-primary" type="submit" disabled>
            Save changes
        </button>
    </div>
    {{ end }}

</form>

{{ template "flash_box" . }}

<script>
    const form = document.getElementById("settings-form");
    const inputs = form.querySelectorAll("input");
    const discardButton = document.getElementById("discard-changes");
    const saveButton = document.getElementById("save-changes");

    function updateEditState() {
        let hasChanges = false;

        inputs.forEach(input => {
            const row = input.closest(".editable-row");
            const edited = input.value !== input.dataset.originalValue;

            row.classList.toggle("edited", edited);

            if (edited) {
                hasChanges = true;
            }
        });

        discardButton.disabled = !hasChanges;
        saveButton.disabled = !hasChanges;
    }

    inputs.forEach(input => {
        input.addEventListener("input", updateEditState);
    });

    discardButton.addEventListener("click", () => {
        inputs.forEach(input => {
            input.value = input.dataset.originalValue;
        });

        updateEditState();
    });

    updateEditState();
</script>

{{ end }}
